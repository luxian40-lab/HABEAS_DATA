<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave | Atención al Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center">
            <i class="fas fa-water text-4xl text-white mb-2"></i>
            <h1 class="text-2xl font-bold text-white">Hola, somos Wave</h1>
            <p class="text-blue-100 text-sm">¿En qué podemos ayudarte hoy?</p>
        </div>
        
        <div class="p-8">
            <form id="ticketForm" onsubmit="enviarTicket(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Tu Nombre</label>
                    <input type="text" id="nombre" required class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white focus:border-blue-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white focus:border-blue-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Cuéntanos tu problema</label>
                    <textarea id="mensaje" rows="4" required class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white focus:border-blue-500 focus:outline-none transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg transition transform hover:scale-[1.02]">
                    Enviar Solicitud
                </button>
            </form>

            <div id="successMessage" class="hidden text-center mt-6 animate-pulse">
                <div class="text-green-400 text-5xl mb-2"><i class="fas fa-check-circle"></i></div>
                <h3 class="text-white font-bold text-lg">¡Recibido!</h3>
                <p class="text-slate-400 text-sm mt-1">Un agente Wave te contactará pronto.</p>
                <button onclick="location.reload()" class="mt-4 text-xs text-blue-400 hover:text-blue-300 underline">Enviar otro</button>
            </div>
        </div>
    </div>

    <script>
        async function enviarTicket(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            btn.disabled = true;

            const datos = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                mensaje: document.getElementById('mensaje').value
            };

            try {
                await fetch('http://localhost:8000/crear_ticket_cliente', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });
                document.getElementById('ticketForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            } catch(err) {
                alert("Error al enviar. Intenta nuevamente.");
                btn.innerHTML = 'Enviar Solicitud';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
